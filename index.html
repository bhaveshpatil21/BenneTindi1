:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:6px}

/* ══════════ BACKDROP ══════════ */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:#2a0f0c}
.scene .photo{
  position:absolute;inset:0;z-index:1;
  background:var(--bg-image) var(--bg-focus)/cover no-repeat;
}
/* Just enough shading for the chrome to read — the artwork carries its own
   colour, so this stays out of its way. */
.wash{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(to top,    rgba(26,7,5,.80) 0%, rgba(26,7,5,.34) 22%, transparent 46%),
    linear-gradient(to bottom, rgba(20,6,6,.52) 0%, rgba(20,6,6,.14) 12%, transparent 24%);
}
.vignette{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  box-shadow:inset 0 0 220px 40px rgba(28,6,4,.34);
}
.grain{
  position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
}

/* ══════════ CHROME ══════════ */
.ui{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;
    padding:26px clamp(18px,3.4vw,44px);
    padding-top:max(26px,env(safe-area-inset-top));pointer-events:none}
.ui > *{pointer-events:auto}

.bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.clock{font-size:15px;font-weight:400;letter-spacing:.01em;opacity:.92;
       text-shadow:0 2px 12px rgba(0,0,0,.5);white-space:nowrap;min-width:88px}
.online{display:flex;align-items:center;gap:9px;font-size:15px;opacity:.95;
        text-shadow:0 2px 12px rgba(0,0,0,.5);white-space:nowrap}
.pip{width:9px;height:9px;border-radius:50%;background:#22c55e;flex:none;
     box-shadow:0 0 10px rgba(34,197,94,.85);animation:blink 3s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.out{display:flex;gap:26px;min-width:88px;justify-content:flex-end}
.out a{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;
       opacity:.9;transition:opacity .2s;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.out a:hover{opacity:1}
.out svg{width:17px;height:17px;flex:none}
.out .arw{width:11px;height:11px;opacity:.7}

.stage{flex:1}

/* ══════════ PLAYER PILL ══════════ */
.dock{position:fixed;left:0;right:0;bottom:clamp(22px,4.2vh,46px);z-index:6;
      display:flex;flex-direction:column;align-items:center;gap:12px;
      padding:0 16px;padding-bottom:env(safe-area-inset-bottom)}
.pill{
  width:min(94vw,730px);
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  gap:clamp(14px,2vw,22px);
  padding:14px clamp(16px,2vw,22px);
  border-radius:999px;
  background:rgba(74,18,12,.42);
  backdrop-filter:blur(26px) saturate(1.3);
  -webkit-backdrop-filter:blur(26px) saturate(1.3);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 26px 70px -22px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.14);
}
.cover{
  width:clamp(54px,7vw,68px);aspect-ratio:1;border-radius:50%;overflow:hidden;flex:none;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
  box-shadow:0 6px 20px rgba(0,0,0,.45);
}
.cover img{width:100%;height:100%;object-fit:cover;transform:scale(1.36);
           opacity:0;transition:opacity .5s ease;display:block}
.cover img.on{opacity:1}
body.playing .cover{animation:rot 22s linear infinite}
@keyframes rot{to{rotate:360deg}}

.meta{min-width:0}
.ttl{font-size:clamp(14.5px,1.55vw,18px);font-weight:600;line-height:1.3;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.art{font-size:clamp(12px,1.2vw,13.5px);font-weight:400;opacity:.66;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.seek{position:relative;height:14px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.seek .rail{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:rgba(255,255,255,.22)}
.seek .fill{position:absolute;left:0;height:3px;border-radius:2px;background:#fff;width:0;transition:width .2s linear}
.seek .dot{position:absolute;left:0;width:9px;height:9px;border-radius:50%;background:#fff;
           translate:-50% 0;transition:left .2s linear;box-shadow:0 1px 5px rgba(0,0,0,.5)}
.time{font-size:11.5px;opacity:.6;margin-top:5px;font-variant-numeric:tabular-nums}

.keys{display:flex;align-items:center;gap:clamp(10px,1.5vw,18px)}
.k{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;
   opacity:.8;transition:opacity .18s,background .18s,transform .1s}
.k:hover{opacity:1;background:rgba(255,255,255,.12)}
.k:active{transform:scale(.92)}
.k svg{width:20px;height:20px;fill:#fff}
.k.big{width:clamp(48px,5.6vw,58px);height:clamp(48px,5.6vw,58px);
       background:#fff;opacity:1;box-shadow:0 8px 24px rgba(0,0,0,.42)}
.k.big:hover{background:#fff;transform:scale(1.05)}
.k.big svg{fill:#3a0f0a;width:22px;height:22px}

.pill.away{opacity:0;visibility:hidden;pointer-events:none;position:absolute;
           transition:opacity .35s ease,visibility .35s}

/* ── spotify panel: same glass frame, native widget inside ── */
.spot{
  width:min(94vw,730px);
  border-radius:22px;padding:10px;
  background:rgba(74,18,12,.42);
  backdrop-filter:blur(26px) saturate(1.3);
  -webkit-backdrop-filter:blur(26px) saturate(1.3);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 26px 70px -22px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.14);
  opacity:0;visibility:hidden;position:absolute;pointer-events:none;
  transition:opacity .35s ease,visibility .35s;
}
.spot.here{opacity:1;visibility:visible;position:static;pointer-events:auto}
.spot iframe{display:block;width:100%;height:352px;border:0;border-radius:14px}
.spot .hint{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.45;
            text-align:center;padding:9px 4px 3px}

/* discreet station switcher */
.stations{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;
          font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
          max-width:min(94vw,730px);opacity:.5;transition:opacity .25s}
.stations:hover{opacity:.95}
.stations button{opacity:.65;transition:opacity .2s;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.stations button:hover{opacity:1}
.stations button[aria-current="true"]{opacity:1;border-bottom:1px solid rgba(255,255,255,.85);padding-bottom:3px}

/* ══════════ DOOR ══════════ */
.door{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;
      padding:24px;background:rgba(20,8,8,.42);
      transition:opacity .8s ease,visibility .8s}
.door.open{opacity:0;visibility:hidden;pointer-events:none}
.door .line{font-size:12.5px;letter-spacing:.34em;text-transform:uppercase;opacity:.72;
            font-weight:500;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.enter{margin-top:26px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:500;
       color:#3a0f0a;background:#fff;padding:16px 38px;border-radius:999px;
       box-shadow:0 16px 44px rgba(0,0,0,.5);transition:letter-spacing .35s,transform .2s}
.enter:hover{letter-spacing:.4em;transform:translateY(-2px)}

#yt{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:-200px;left:-200px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:640px){
  .clock,.online span:last-child{font-size:13px}
  .out a span{display:none}
  .out{gap:16px;min-width:0}
  .clock{min-width:0}
  .pill{grid-template-columns:auto 1fr;gap:12px;border-radius:26px;padding:14px 16px}
  .keys{grid-column:1/-1;justify-content:center;margin-top:2px}
  .stations{gap:12px;font-size:9.5px}
  .spot iframe{height:232px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- The artwork is embedded in the CSS above as a data URI, so this page
     is one self-contained file with nothing to go missing. -->
<div class="scene" aria-hidden="true">
  <div class="photo"></div>
</div>

<div class="wash"></div>
<div class="vignette"></div>
<div class="grain"></div>

<!-- ═══════════════ INTERFACE ═══════════════ -->
<div class="ui">
  <div class="bar">
    <div class="clock" id="clock">&nbsp;</div>
    <div class="online"><span class="pip"></span><span><b id="count">—</b> online</span></div>
    <nav class="out">
      <a id="spotify" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="#1DB954"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.6 14.4a.62.62 0 01-.86.21c-2.35-1.44-5.3-1.76-8.79-.96a.62.62 0 11-.28-1.22c3.81-.87 7.08-.5 9.72 1.11.29.18.38.56.21.86zm1.23-2.73a.78.78 0 01-1.07.26c-2.69-1.65-6.79-2.13-9.97-1.17a.78.78 0 11-.45-1.49c3.63-1.1 8.15-.56 11.24 1.33.36.23.48.71.25 1.07zm.1-2.84c-3.23-1.92-8.55-2.09-11.63-1.16a.93.93 0 11-.54-1.79c3.54-1.07 9.42-.86 13.13 1.34a.93.93 0 11-.96 1.6z"/></svg>
        <span>Spotify</span>
        <svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </a>
      <a id="ytm" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="#FF0033"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 17.4a7.4 7.4 0 110-14.8 7.4 7.4 0 010 14.8zM9.9 8.5l6 3.5-6 3.5z"/></svg>
        <span>YT Music</span>
        <svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </a>
    </nav>
  </div>

  <div class="stage"></div>
</div>

<!-- ═══════════════ PLAYER ═══════════════ -->
<div class="dock">
  <div class="pill">
    <div class="cover"><img id="cover" alt=""></div>
    <div class="meta">
      <div class="ttl" id="title">Opening up…</div>
      <div class="art" id="artist">&nbsp;</div>
      <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="rail"></div><div class="fill" id="fill"></div><div class="dot" id="dot"></div>
      </div>
      <div class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></div>
    </div>
    <div class="keys">
      <button class="k" id="prev" aria-label="Previous track">
        <svg viewBox="0 0 24 24"><path d="M6 6h2.5v12H6zm12.5 0v12L9 12z"/></svg>
      </button>
      <button class="k big" id="play" aria-label="Play">
        <svg id="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="k" id="next" aria-label="Next track">
        <svg viewBox="0 0 24 24"><path d="M15.5 6H18v12h-2.5zM5.5 6v12L15 12z"/></svg>
      </button>
    </div>
  </div>

  <div class="spot" id="spot">
    <div id="spotMount"></div>
    <div class="hint">Log in to Spotify for full tracks</div>
  </div>

  <nav class="stations" id="stations" aria-label="Stations">
    <button data-s="0" aria-current="true">cafe</button>
    <button data-s="1">indie</button>
    <button data-s="2">lofi</button>
    <button data-s="3">retro</button>
    <button data-s="4">sitar</button>
    <button data-s="5">spotify</button>
  </nav>
</div>

<!-- ═══════════════ DOOR ═══════════════ -->
<div class="door" id="door">
  <div>
    <div class="line">the songs that play at Indian cafés</div>
    <button class="enter" id="enter">Come in</button>
  </div>
</div>

<div id="yt"></div>
<div class="sr" role="status" aria-live="polite" id="live"></div>

<script>
/* Playback runs on the YouTube IFrame Player API — nothing is hosted here,
   every track streams from its rights holder's own channel. */

/* Every playlist below was checked to resolve and report a track count. */
const STATIONS = [
  { list:'PLb3IqBGKOL3hTMjVY0182DeO233_ItDpu' },  /* Cafe Songs Hindi · Indian lounge · 50  */
  { list:'PL1gfuz7ZYcaM2Z7sCGOWORCF0CGmonzOv' },  /* Indie India · Hindi indie · 40         */
  { list:'PLinVjP-aRmluqhaUwqzPf81vg1gC1VYnf' },  /* Tips Official · Hindi lofi · 286       */
  { list:'PLP7LBOIQKXnC-LDzuYY7o9kX80WTdjE_t' },  /* Saregama · old Hindi · 548             */
  { list:'PLqKfO8peuae3xOZmUVu12Ol736BDq6aKv' },  /* sitar instrumental · 24                */
  { spotify:'4Wgb1FsjIBwtAclf3oM4v8' },           /* your own Spotify playlist              */
];

const $ = id => document.getElementById(id);
let player, ready = false, station = 0, vid = null, scrub = false, misses = 0;

/* ── clock ─────────────────────────────── */
setInterval(tick, 1000); tick();
function tick(){
  $('clock').textContent = new Date()
    .toLocaleTimeString('en-IN', {hour:'numeric', minute:'2-digit'})
    .toLowerCase().replace(/\s/,' ');
}

/* ── how full the café is ──────────────────
   Follows the clock in your timezone and drifts. Local, not a
   live headcount — a real one needs a websocket server. */
setInterval(room, 5000); room();
function room(){
  const d = new Date(), h = d.getHours() + d.getMinutes()/60;
  const peak = t => Math.exp(-((h-t)**2)/3.4);
  const n = 6 + 24*peak(10.5) + 32*peak(17.5) + 16*peak(21.5)
          + 3*Math.sin(Date.now()/47000) + 2*Math.sin(Date.now()/11000);
  $('count').textContent = Math.max(3, Math.round(n));
}

/* ── youtube ───────────────────────────── */
const s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(s);

window.onYouTubeIframeAPIReady = () => {
  /* The origin param is required on a real host but breaks the player when
     the page is opened straight off disk (file://), where origin is "null". */
  const vars = { listType:'playlist', list:STATIONS[0].list, playsinline:1, controls:0 };
  if (location.protocol === 'http:' || location.protocol === 'https:')
    vars.origin = location.origin;

  player = new YT.Player('yt', {
    host:'https://www.youtube-nocookie.com',
    playerVars: vars,
    events:{
      onReady(){ ready = true; player.setVolume(75); player.setShuffle(true); links(); autoplay(); },
      onStateChange(e){
        const P = YT.PlayerState;
        document.body.classList.toggle('playing', e.data === P.PLAYING);
        icon(e.data === P.PLAYING);
        if (e.data === P.PLAYING || e.data === P.BUFFERING) read();
        if (e.data === P.ENDED) player.nextVideo();
      },
      /* region-locked or embed-disabled video: step over it */
      onError(){
        if (++misses > 8){ $('title').textContent = 'Kitchen\u2019s shut \u2014 try another station'; return; }
        setTimeout(() => player.nextVideo(), 350);
      }
    }
  });
};

function read(){
  const d = player.getVideoData && player.getVideoData();
  if (!d || !d.video_id || d.video_id === vid) return;
  vid = d.video_id; misses = 0;

  const { title, artist } = tidy(d.title || '', d.author || '');
  $('title').textContent  = title;
  $('artist').textContent = artist;
  $('live').textContent   = `Now playing: ${title} \u2014 ${artist}`;

  const img = $('cover'); img.classList.remove('on');
  const hi = `https://i.ytimg.com/vi/${vid}/maxresdefault.jpg`;
  const lo = `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`;
  const p = new Image();
  p.onload  = () => img.src = p.naturalWidth > 200 ? hi : lo;
  p.onerror = () => img.src = lo;
  p.src = hi;
  img.onload = () => img.classList.add('on');
}

/* YouTube titles carry freight: "Song | Film | Singer (Lyrical) 4K".
   Strip the freight, keep the song. */
function tidy(raw, channel){
  const junk = /\b(official|lyrical?|lyrics|video song|full (video|song)|audio|hd|4k|1080p|remastered|jukebox|music video|visuali[sz]er)\b/i;
  const s = raw.replace(/\([^()]*\)|\[[^\[\]]*\]/g, m => junk.test(m) ? '' : m)
               .replace(/\s{2,}/g,' ').trim();
  const parts = s.split(/\s*[|｜]\s*/).map(x => x.trim()).filter(Boolean);
  let title = parts[0] || s, artist = '';
  for (let i = 1; i < parts.length; i++)
    if (parts[i].length <= 44 && !junk.test(parts[i])) { artist = parts[i]; break; }
  if (!artist) artist = channel;
  artist = artist.replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/i,'')
                 .replace(/\bOfficial\b/ig,'').replace(/\s{2,}/g,' ').trim();
  return { title: title.replace(/[-–—\s]+$/,'').trim() || 'Untitled', artist };
}

/* ── transport ─────────────────────────── */
function icon(playing){
  $('icon').innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
}
function toggle(){
  if (!ready) return;
  player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
}
$('play').onclick = toggle;
$('next').onclick = () => ready && player.nextVideo();
$('prev').onclick = () => { if (!ready) return;
  player.getCurrentTime() > 3 ? player.seekTo(0, true) : player.previousVideo(); };

setInterval(() => {
  if (!ready || scrub || !player.getDuration) return;
  const d = player.getDuration(), t = player.getCurrentTime();
  if (!d) return;
  paint(t/d); $('cur').textContent = mmss(t); $('dur').textContent = mmss(d);
}, 250);

const mmss = x => (x = Math.max(0, Math.floor(x||0)), Math.floor(x/60)+':'+String(x%60).padStart(2,'0'));
function paint(p){
  p = Math.min(1, Math.max(0, p||0));
  $('fill').style.width = p*100+'%';
  $('dot').style.left   = p*100+'%';
  $('seek').setAttribute('aria-valuenow', Math.round(p*100));
}
const at = x => { const r = $('seek').getBoundingClientRect();
                  const p = Math.min(1, Math.max(0, (x-r.left)/r.width)); paint(p); return p; };
$('seek').addEventListener('pointerdown', e => {
  if (!ready) return; scrub = true; $('seek').setPointerCapture(e.pointerId); at(e.clientX); });
$('seek').addEventListener('pointermove', e => scrub && at(e.clientX));
$('seek').addEventListener('pointerup', e => {
  if (!scrub) return; player.seekTo(at(e.clientX)*player.getDuration(), true); scrub = false; });
$('seek').addEventListener('keydown', e => {
  if (!ready) return; const d = player.getDuration(); if (!d) return;
  if (e.key === 'ArrowRight'){ player.seekTo(Math.min(d, player.getCurrentTime()+5), true); e.preventDefault(); }
  if (e.key === 'ArrowLeft' ){ player.seekTo(Math.max(0, player.getCurrentTime()-5), true); e.preventDefault(); }
});

/* ── stations ──────────────────────────── */
$('stations').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tune(Number(b.dataset.s));
});
function tune(i){
  station = i; links();
  document.querySelectorAll('#stations button').forEach(b =>
    b.setAttribute('aria-current', String(Number(b.dataset.s) === i)));

  /* Spotify runs in its own widget — swap the pill out for it and
     stop YouTube so two things aren't playing over each other. */
  if (STATIONS[i].spotify){
    mountSpotify(STATIONS[i].spotify);
    document.querySelector('.pill').classList.add('away');
    $('spot').classList.add('here');
    if (ready) player.pauseVideo();
    document.body.classList.remove('playing');
    return;
  }

  $('spot').classList.remove('here');
  document.querySelector('.pill').classList.remove('away');
  stopSpotify();

  if (!ready) return;
  vid = null; misses = 0;
  $('title').textContent = 'Changing the record…'; $('artist').textContent = '';
  player.loadPlaylist({ listType:'playlist', list:STATIONS[i].list });
  player.setShuffle(true);
  setTimeout(jump, 400);
}
function links(){
  const s = STATIONS[station];
  if (s.list) $('ytm').href = 'https://www.youtube.com/playlist?list=' + s.list;
  /* the header link is the café's own Spotify home, whatever's playing */
  $('spotify').href = 'https://open.spotify.com/playlist/4Wgb1FsjIBwtAclf3oM4v8';
}

/* Built on first use so the widget doesn't load with the page. */
function mountSpotify(id){
  const mount = $('spotMount');
  if (mount.firstChild) return;
  const f = document.createElement('iframe');
  f.src = `https://open.spotify.com/embed/playlist/${id}?utm_source=generator&theme=0`;
  f.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
  f.setAttribute('allowfullscreen','');
  f.loading = 'lazy';
  f.title = 'Spotify playlist';
  mount.appendChild(f);
}
/* Reloading the src is the only way to silence a cross-origin embed. */
function stopSpotify(){
  const f = $('spotMount').firstChild;
  if (f) f.src = f.src;
}

/* ── starting the music ────────────────────
   Browsers refuse to play audio until the visitor has interacted with the
   page, so something has to be clicked. Rather than demanding the button
   specifically, the FIRST touch, click or keypress anywhere counts. */
/* Land on a random track, bounded by the playlist's real length —
   some stations hold 24 items, others 548. */
function jump(){
  const n = (player.getPlaylist && player.getPlaylist() || []).length || 20;
  player.playVideoAt(Math.floor(Math.random() * n));
}

let started = false;

function start(){
  if (started) return;
  started = true;
  $('door').classList.add('open');
  const go = setInterval(() => {
    if (!ready) return;
    clearInterval(go);
    player.setShuffle(true);
    jump();
  }, 120);
}

/* Chrome remembers domains where you've played media before and will let
   those autoplay. Worth a try — if it's refused, nothing happens and the
   door stays up waiting for a click. */
function autoplay(){
  if (started) return;
  jump();
  setTimeout(() => {
    if (!started && player.getPlayerState() === YT.PlayerState.PLAYING){
      started = true;
      $('door').classList.add('open');
    }
  }, 700);
}

$('enter').onclick = start;
$('door').addEventListener('click', start);
['pointerdown','keydown','touchstart'].forEach(ev =>
  document.addEventListener(ev, start, { once:true, passive:true }));

/* If the API never answers — offline, blocked, or opened over file:// in a
   browser that won't allow it — say so instead of sitting on a stale label. */
setTimeout(() => {
  if (ready) return;
  $('title').textContent  = 'Player did not load';
  $('artist').textContent = location.protocol === 'file:'
    ? 'Serve the folder over http, not file://'
    : 'Check your connection or any blockers';
}, 9000);

document.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); toggle(); }
  if (e.key.toLowerCase() === 'n') ready && player.nextVideo();
  if (e.key.toLowerCase() === 'p') ready && player.previousVideo();
});
</script>
</body>
</html>
